- acceptance_criteria:
  - Manifest hashing opens selected files with no-follow semantics where supported
    and hashes from the validated descriptor rather than reopening by pathname.
  - Descriptor-level identity checks verify the hashed file is the same regular file
    selected during validation.
  - Intermediate symlink and final symlink rejection behavior remains deterministic
    and tested.
  - Regression tests cover symlink/TOCTOU-adjacent cases without adding repository
    writes or publication capabilities.
  created_at: '2026-09-15T11:30:31Z'
  dependencies: []
  description: Current manifest hashing validates selected files by pathname using
    lstat/realpath before streaming and final lstat checks. This is acceptable for
    the current no-write MVP foundation, but before manifests authorize uploads or
    publication, hashing should operate on a securely opened file descriptor with
    no-follow protections and descriptor-level identity checks to reduce TOCTOU/symlink
    race risk.
